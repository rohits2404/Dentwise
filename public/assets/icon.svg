<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F9CF9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#EFF6FF" />

  <!-- Tooth shape -->
  <path d="M64 18
    C48 18, 32 28, 32 46
    C32 58, 36 66, 38 78
    C40 90, 42 104, 50 104
    C56 104, 56 92, 58 82
    C60 72, 62 68, 64 68
    C66 68, 68 72, 70 82
    C72 92, 72 104, 78 104
    C86 104, 88 90, 90 78
    C92 66, 96 58, 96 46
    C96 28, 80 18, 64 18Z"
    fill="url(#toothGrad)"
    stroke="#2563EB"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Tooth highlight/shine -->
  <ellipse cx="52" cy="42" rx="10" ry="12" fill="white" opacity="0.3" />
  <ellipse cx="50" cy="38" rx="5" ry="6" fill="white" opacity="0.5" />

  <!-- Voice/sound waves coming from the tooth -->
  <!-- Left sound waves -->
  <path d="M22 56 Q16 64 22 72" 
    stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M14 50 Q4 64 14 78" 
    stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Right sound waves -->
  <path d="M106 56 Q112 64 106 72" 
    stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M114 50 Q124 64 114 78" 
    stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Microphone icon inside tooth -->
  <!-- Mic body -->
  <rect x="58" y="38" width="12" height="20" rx="6" fill="url(#micGrad)" />
  <!-- Mic highlight -->
  <rect x="60" y="40" width="5" height="10" rx="2.5" fill="white" opacity="0.35" />
  <!-- Mic stand arc -->
  <path d="M54 52 Q54 62 64 62 Q74 62 74 52" 
    stroke="#EC4899" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Mic stand line -->
  <line x1="64" y1="62" x2="64" y2="68" 
    stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mic base -->
  <line x1="58" y1="68" x2="70" y2="68" 
    stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Small sparkle/AI accent dots -->
  <circle cx="46" cy="30" r="2" fill="#34D399" opacity="0.8" />
  <circle cx="82" cy="30" r="2" fill="#34D399" opacity="0.8" />
  <circle cx="36" cy="56" r="1.5" fill="#F472B6" opacity="0.7" />
  <circle cx="92" cy="56" r="1.5" fill="#F472B6" opacity="0.7" />
</svg>